# Deployment workflow for HK Energieberatung (GitHub Pages / Static Hosting)
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Mailer .env from GitHub Secrets
        env:
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME || 'hallo@masrisystems.com' }}
          MAIL_HOST: ${{ secrets.MAIL_HOST || 'gienah.uberspace.de' }}
          MAIL_PORT: ${{ secrets.MAIL_PORT || '465' }}
          MAIL_ENCRYPTION: ${{ secrets.MAIL_ENCRYPTION || 'ssl' }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS || 'hallo@masrisystems.com' }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME || 'HK Energieberatung' }}
          MAIL_TO_ADDRESS: ${{ secrets.MAIL_TO_ADDRESS || 'info@hk-energieberatung.de' }}
        run: |
          mkdir -p forms
          cat <<EOF > forms/.env
          MAIL_MAILER=smtp
          MAIL_HOST=${MAIL_HOST}
          MAIL_PORT=${MAIL_PORT}
          MAIL_USERNAME=${MAIL_USERNAME}
          MAIL_PASSWORD=${MAIL_PASSWORD}
          MAIL_ENCRYPTION=${MAIL_ENCRYPTION}
          MAIL_FROM_ADDRESS="${MAIL_FROM_ADDRESS}"
          MAIL_FROM_NAME="${MAIL_FROM_NAME}"
          MAIL_TO_ADDRESS="${MAIL_TO_ADDRESS}"
          EOF
          chmod 600 forms/.env || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
